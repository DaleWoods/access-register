# Render Blueprint for the Third-Party Access Register.
#
# In Render: New → Blueprint → pick this repository → Apply.
# Nothing to set by hand — this Blueprint declares its own database, so Render
# creates it and wires the connection string in, exactly as the bis-app
# Blueprint does for bis-db.
#
# The database is on a paid plan on purpose. Render permits a single free-tier
# Postgres per account and this account's is bis-db, so a second `plan: free`
# fails the whole sync with "cannot have more than one active free tier
# database". Sharing bis-db instead is not workable either: it lives in Oregon,
# this service was created in Frankfurt, and Render cannot move an existing
# service between regions — a Frankfurt service cannot resolve an Oregon
# internal hostname.
#
# Both resources are pinned to frankfurt: it matches the existing service, and
# the register holds names and email addresses of UK staff.

databases:
  - name: access-register-db
    databaseName: access_register
    user: access_register
    # Render's smallest paid Postgres. `free` is not available — see above.
    plan: basic-256mb
    region: frankfurt
    # The register holds personal data, so no public ingress.
    ipAllowList: []

services:
  - type: web
    name: access-register
    runtime: node
    plan: free
    # Must match the database's region: Render supplies an internal hostname
    # that only resolves inside one region. A service's region cannot be
    # changed after creation, so this matches where the service already is.
    region: frankfurt
    branch: main

    # --include=dev is deliberate: Render sets NODE_ENV=production, which makes
    # a plain `npm ci` skip devDependencies — and the build needs TypeScript,
    # Tailwind and PostCSS.
    buildCommand: npm ci --include=dev && npm run build
    # Applies migrations and ensures an admin exists before serving traffic.
    startCommand: npm run start:render

    healthCheckPath: /api/health

    envVars:
      # Wired automatically from the database declared above. Nothing to set.
      - key: DATABASE_URL
        fromDatabase:
          name: access-register-db
          property: connectionString

      # DATABASE_SCHEMA is deliberately unset: the app defaults to its own
      # `access_register` schema, which is correct whether it has a database to
      # itself or is sharing one. See src/lib/database-url.mjs.

      # Signs the session cookie. Generated once and kept; changing it signs
      # everyone out.
      - key: AUTH_SECRET
        generateValue: true

      # The first admin. Without this nobody can sign in to a fresh database.
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: dalewoods130@gmail.com
      - key: BOOTSTRAP_ADMIN_NAME
        value: Dale Woods
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true

      # Loads the demo vendors, people and accounts, but only while the
      # register is completely empty. Set this to "false" before putting real
      # data in, and delete the demo vendors from the app.
      - key: SEED_DEMO_DATA
        value: "true"
      - key: SEED_PASSWORD
        generateValue: true

      # Leaver evidence uploads. On the free plan this is ephemeral container
      # storage and is lost on every deploy — see the disk block below.
      - key: EVIDENCE_STORAGE_DIR
        value: ./storage/evidence

      - key: NODE_VERSION
        value: "22"

    # Persistent storage for leaver evidence files. Render disks need a paid
    # instance type, so this is commented out for the free plan. When you
    # upgrade, uncomment this and set EVIDENCE_STORAGE_DIR to /var/data/evidence.
    #
    # disk:
    #   name: evidence
    #   mountPath: /var/data
    #   sizeGB: 5
