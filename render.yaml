# Render Blueprint for the Third-Party Access Register.
#
# In Render: New → Blueprint → pick this repository → Apply.
#
# ONE MANUAL STEP: set DATABASE_URL on the service, then Manual Deploy.
#
# This Blueprint deliberately does not declare a database. Render permits one
# free-tier Postgres per account and this account's is bis-db, so a second
# `plan: free` fails the whole sync. Sharing bis-db does not work either — it is
# in Oregon, this service is in Frankfurt, internal hostnames only resolve
# within a region, and a service's region cannot be changed after creation.
#
# So the database lives outside Render, on a free Postgres from Neon or
# Supabase, and its connection string is pasted in once. Public hosts, so no
# region constraint. See README.md → Deploying to Render for the walkthrough.
#
# To move it onto Render later, add a `databases:` block on a paid plan and
# point DATABASE_URL at it with fromDatabase. Nothing else changes.

services:
  - type: web
    name: access-register
    runtime: node
    plan: free
    # Where the service already exists; a region cannot be changed afterwards.
    # The database is external and reached over a public host, so there is no
    # region constraint — just pick an EU region for it to keep latency down.
    region: frankfurt
    branch: main

    # --include=dev is deliberate: Render sets NODE_ENV=production, which makes
    # a plain `npm ci` skip devDependencies — and the build needs TypeScript,
    # Tailwind and PostCSS.
    buildCommand: npm ci --include=dev && npm run build
    # Applies migrations and ensures an admin exists before serving traffic.
    startCommand: npm run start:render

    healthCheckPath: /api/health

    envVars:
      # Set by hand on the service, then Manual Deploy. Render only prompts for
      # a sync: false value during an interactive Apply, never on a git push.
      # Paste the external database's connection string exactly as given.
      - key: DATABASE_URL
        sync: false

      # DATABASE_SCHEMA is deliberately unset: the app defaults to its own
      # `access_register` schema, which is correct whether the database is
      # dedicated or shared. See src/lib/database-url.mjs.

      # Signs the session cookie. Generated once and kept; changing it signs
      # everyone out.
      - key: AUTH_SECRET
        generateValue: true

      # The first admin. Without this nobody can sign in to a fresh database.
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: dalewoods130@gmail.com
      - key: BOOTSTRAP_ADMIN_NAME
        value: Dale Woods
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true

      # Loads the demo vendors, people and accounts, but only while the
      # register is completely empty. Set this to "false" before putting real
      # data in, and delete the demo vendors from the app.
      - key: SEED_DEMO_DATA
        value: "true"
      - key: SEED_PASSWORD
        generateValue: true

      # Leaver evidence uploads. On the free plan this is ephemeral container
      # storage and is lost on every deploy — see the disk block below.
      - key: EVIDENCE_STORAGE_DIR
        value: ./storage/evidence

      - key: NODE_VERSION
        value: "22"

    # Persistent storage for leaver evidence files. Render disks need a paid
    # instance type, so this is commented out for the free plan. When you
    # upgrade, uncomment this and set EVIDENCE_STORAGE_DIR to /var/data/evidence.
    #
    # disk:
    #   name: evidence
    #   mountPath: /var/data
    #   sizeGB: 5
