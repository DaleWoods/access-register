# Render Blueprint for the Third-Party Access Register.
#
# In Render: New → Blueprint → pick this repository → Apply.
# Nothing to fill in by hand — the database is wired automatically, the same
# way the bis-app Blueprint wires its own.
#
# WHY IT REUSES bis-db
# Render allows a single free-tier Postgres per account, and this account's one
# free database is `bis-db`. Declaring a second fails the whole sync with
# "cannot have more than one active free tier database", so this Blueprint
# points at the existing one instead.
#
# Sharing is safe: DATABASE_SCHEMA puts every table this app owns — including
# Prisma's own migration history — inside an `access_register` schema, so it
# cannot collide with anything bis-app keeps in `public`. To undo it entirely,
# drop that one schema.
#
# To give the register its own database later, replace the fromDatabase block
# with a plain connection string set under Environment, and drop
# DATABASE_SCHEMA. See README.md → Deploying to Render.

services:
  - type: web
    name: access-register
    runtime: node
    plan: free
    # Must match bis-db's region, because the connection string Render supplies
    # is an internal hostname that only resolves inside one region.
    region: oregon
    branch: main

    # --include=dev is deliberate: Render sets NODE_ENV=production, which makes
    # a plain `npm ci` skip devDependencies — and the build needs TypeScript,
    # Tailwind and PostCSS.
    buildCommand: npm ci --include=dev && npm run build
    # Applies migrations and ensures an admin exists before serving traffic.
    startCommand: npm run start:render

    healthCheckPath: /api/health

    envVars:
      # The existing free Postgres, referenced by its Render name.
      - key: DATABASE_URL
        fromDatabase:
          name: bis-db
          property: connectionString

      # Keeps this app's tables out of bis-app's way. Removing this would put
      # them in `public` alongside bis-app's own.
      - key: DATABASE_SCHEMA
        value: access_register

      # Caps the connection pool so this app cannot exhaust a shared instance's
      # connections and starve bis-app.
      - key: DATABASE_CONNECTION_LIMIT
        value: "5"

      # Signs the session cookie. Generated once and kept; changing it signs
      # everyone out.
      - key: AUTH_SECRET
        generateValue: true

      # The first admin. Without this nobody can sign in to a fresh database.
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: dalewoods130@gmail.com
      - key: BOOTSTRAP_ADMIN_NAME
        value: Dale Woods
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true

      # Loads the demo vendors, people and accounts, but only while the
      # register is completely empty. Set this to "false" before putting real
      # data in, and delete the demo vendors from the app.
      - key: SEED_DEMO_DATA
        value: "true"
      - key: SEED_PASSWORD
        generateValue: true

      # Leaver evidence uploads. On the free plan this is ephemeral container
      # storage and is lost on every deploy — see the disk block below.
      - key: EVIDENCE_STORAGE_DIR
        value: ./storage/evidence

      - key: NODE_VERSION
        value: "22"

    # Persistent storage for leaver evidence files. Render disks need a paid
    # instance type, so this is commented out for the free plan. When you
    # upgrade, uncomment this and set EVIDENCE_STORAGE_DIR to /var/data/evidence.
    #
    # disk:
    #   name: evidence
    #   mountPath: /var/data
    #   sizeGB: 5
