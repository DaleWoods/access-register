# Render Blueprint for the Third-Party Access Register.
#
# In Render: New → Blueprint → pick this repository → Apply.
#
# NOTE ON THE DATABASE
# This Blueprint does not create one. Render allows only a single free-tier
# Postgres per account, so declaring one here fails the whole sync with
# "cannot have more than one active free tier database" if you already have
# one for another project.
#
# Instead, set DATABASE_URL yourself when prompted (it is marked sync: false,
# so Render asks for it during Apply). Two ways to fill it in:
#
#   a) Reuse an existing Render Postgres, in its own schema. Take that
#      database's Internal Database URL and append a schema parameter:
#
#        postgresql://…/yourdb?schema=access_register
#
#      Prisma creates the schema on first deploy and keeps every table,
#      including its migration history, inside it. Nothing in that database's
#      public schema is touched. Use the Internal URL only if this service and
#      the database are in the same region — otherwise use the External URL.
#
#   b) Give this app its own database, on a paid plan or another provider,
#      and paste that connection string.
#
# See README.md → Deploying to Render for the full walkthrough.

services:
  - type: web
    name: access-register
    runtime: node
    plan: free
    # Must match the region of whichever database you point DATABASE_URL at,
    # if you are using that database's Internal URL.
    region: frankfurt
    branch: main

    # --include=dev is deliberate: Render sets NODE_ENV=production, which makes
    # a plain `npm ci` skip devDependencies — and the build needs TypeScript,
    # Tailwind and PostCSS.
    buildCommand: npm ci --include=dev && npm run build
    # Applies migrations and ensures an admin exists before serving traffic.
    startCommand: npm run start:render

    healthCheckPath: /api/health

    envVars:
      # Set during Apply. See the note at the top of this file.
      - key: DATABASE_URL
        sync: false

      # Signs the session cookie. Generated once and kept; changing it signs
      # everyone out.
      - key: AUTH_SECRET
        generateValue: true

      # The first admin. Without this nobody can sign in to a fresh database.
      # Change the email to whoever should hold the account.
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: dalewoods130@gmail.com
      - key: BOOTSTRAP_ADMIN_NAME
        value: Dale Woods
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true

      # Loads the demo vendors, people and accounts, but only while the
      # register is completely empty. Set this to "false" before putting real
      # data in, and delete the demo vendors from the app.
      - key: SEED_DEMO_DATA
        value: "true"
      - key: SEED_PASSWORD
        generateValue: true

      # Leaver evidence uploads. On the free plan this is ephemeral container
      # storage and is lost on every deploy — see the disk block below.
      - key: EVIDENCE_STORAGE_DIR
        value: ./storage/evidence

      - key: NODE_VERSION
        value: "22"

    # Persistent storage for leaver evidence files. Render disks need a paid
    # instance type, so this is commented out for the free plan. When you
    # upgrade, uncomment this and set EVIDENCE_STORAGE_DIR to /var/data/evidence.
    #
    # disk:
    #   name: evidence
    #   mountPath: /var/data
    #   sizeGB: 5
